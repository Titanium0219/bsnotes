<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sita-pic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(
                circle,
                rgba(255, 120, 0, 0.18),
                transparent 65%
            );

            filter: blur(50px);
            animation: glow 6s infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(0.8);
            }

            to {
                transform: scale(1.3);
            }
        }

        /* Main gallery */

        .gallery {
            width: 100%;
            height: 600px;

            display: flex;
            justify-content: center;
            align-items: center;

            perspective: 1200px;

            position: relative;
        }

        /* Photo cards */

        .photo {
            position: absolute;

            width: 380px;
            height: 500px;

            border-radius: 25px;

            overflow: hidden;

            background: #111;

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.7);

            transition:
                transform 1.2s cubic-bezier(.2,.8,.2,1),
                opacity 1.2s,
                filter 1.2s;

            transform-style: preserve-3d;
        }

        .photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* Center image */

        .photo.active {
            transform:
                translateX(0)
                translateZ(250px)
                rotateY(0deg)
                scale(1);

            opacity: 1;

            filter: brightness(1.1);

            z-index: 5;

            box-shadow:
                0 0 40px rgba(255,150,50,0.25),
                0 30px 80px rgba(0,0,0,0.8);
        }

        /* Left image */

        .photo.left {
            transform:
                translateX(-310px)
                translateZ(-100px)
                rotateY(45deg)
                scale(0.8);

            opacity: 0.6;

            filter: brightness(0.55) blur(1px);

            z-index: 2;
        }

        /* Right image */

        .photo.right {
            transform:
                translateX(310px)
                translateZ(-100px)
                rotateY(-45deg)
                scale(0.8);

            opacity: 0.6;

            filter: brightness(0.55) blur(1px);

            z-index: 2;
        }

        /* Hidden images */

        .photo.hidden {
            transform:
                translateZ(-300px)
                scale(0.5);

            opacity: 0;

            z-index: 0;
        }

        /* Text */

        .caption {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;

            padding: 30px 20px 25px;

            color: white;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.9)
                );

            text-align: center;

            z-index: 10;
        }

        .caption h2 {
            font-size: 25px;

            letter-spacing: 4px;

            margin-bottom: 8px;
        }

        .caption p {
            font-size: 13px;

            color: #ccc;

            letter-spacing: 1px;
        }

        /* Buttons */

        .btn {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 55px;
            height: 55px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.06);

            color: white;

            font-size: 25px;

            cursor: pointer;

            z-index: 20;

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);

            transform:
                translateY(-50%)
                scale(1.1);
        }

        .prev {
            left: 7%;
        }

        .next {
            right: 7%;
        }

        /* Dots */

        .dots {
            position: absolute;

            bottom: 35px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 8px;

            z-index: 30;
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #555;

            transition: 0.4s;
        }

        .dot.active {
            width: 28px;

            border-radius: 10px;

            background: white;
        }

        /* Mobile */

        @media(max-width: 700px) {

            .photo {
                width: 280px;
                height: 400px;
            }

            .photo.left {
                transform:
                    translateX(-130px)
                    translateZ(-100px)
                    rotateY(35deg)
                    scale(0.7);
            }

            .photo.right {
                transform:
                    translateX(130px)
                    translateZ(-100px)
                    rotateY(-35deg)
                    scale(0.7);
            }

            .prev {
                left: 3%;
            }

            .next {
                right: 3%;
            }
        }

    </style>
</head>

<body>
    <audio id="bgMusic" src="Audio/audio1.mp3" loop></audio>

    <div class="gallery">

        <button class="btn prev" onclick="previousPhoto()">
            ‹
        </button>


        <!-- PHOTOS -->

        <div class="photo active">
            <img src="Aphotos/photo.jpg">

            <div class="caption">
                <h2>MEMORIES</h2>
                <p>Every picture has a story.</p>
            </div>
        </div>

        <div class="photo right">
            <img src="Aphotos/photo0.jpg">
        </div>

        <div class="photo right">
            <img src="Aphotos/photo01.jpg">
        </div>

        <div class="photo right">
            <img src="Aphotos/photo2.jpg">
        </div>

        <div class="photo right">
            <img src="Aphotos/photo02.png">
        </div>

        <div class="photo right">
            <img src="Aphotos/photo3.jpg">
        </div>


        <div class="photo hidden">
            <img src="Aphotos/photo03.jpg">
        </div>


        <div class="photo hidden">
            <img src="Aphotos/photo4.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo04.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo5.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo05.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo6.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo06.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo7.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo07.jpg">
        </div>


        <div class="photo left">
            <img src="Aphotos/photo8.jpg">
        </div>
        
        <div class="photo left">
            <img src="Aphotos/photo08.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo9.jpg">
        </div>

         <div class="photo left">
            <img src="Aphotos/photo10.jpg">
        </div>

         <div class="photo left">
            <img src="Aphotos/photo11.jpg">
        </div>

         <div class="photo left">
            <img src="Aphotos/photo12.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo13.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo14.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo15.jpg">
        </div>

        <div class="photo left">
            <img src="Aphotos/photo16.jpg">
        </div>

        <button class="btn next" onclick="nextPhoto()">
            ›
        </button>


        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

    </div>


    <script>

        const photos = document.querySelectorAll(".photo");
        const dots = document.querySelectorAll(".dot");

        let current = 0;


        function updateGallery() {

            photos.forEach((photo, index) => {

                photo.className = "photo";

                let position =
                    (index - current + photos.length)
                    % photos.length;


                if (position === 0) {

                    photo.classList.add("active");

                }

                else if (position === 1) {

                    photo.classList.add("right");

                }

                else if (position === photos.length - 1) {

                    photo.classList.add("left");

                }

                else {

                    photo.classList.add("hidden");

                }

            });


            dots.forEach((dot, index) => {

                dot.classList.toggle(
                    "active",
                    index === current
                );

            });

        }


        function nextPhoto() {

            current++;

            if (current >= photos.length) {

                current = 0;

            }

            updateGallery();

        }


        function previousPhoto() {

            current--;

            if (current < 0) {

                current = photos.length - 1;

            }

            updateGallery();

        }


        /* AUTO ANIMATION */

        setInterval(() => {

            nextPhoto();

        }, 1700);


        /* Mouse wheel */

        document.addEventListener("wheel", (event) => {

            if (event.deltaY > 0) {

                nextPhoto();

            } else {

                previousPhoto();

            }

        });

    </script>
    <script>
const music = document.getElementById("bgMusic");

music.volume = 0.1;

music.play().then(() => {
    let volume = 0.2;

    const fadeIn = setInterval(() => {
        volume += 0.03;
        music.volume = volume;

        if (volume >= 0.6) {
            clearInterval(fadeIn);
        }
    }, 100);
}).catch(() => {
    document.addEventListener("click", () => {
        music.play();

        let volume = 0.3;

        const fadeIn = setInterval(() => {
            volume += 0.04;
            music.volume = volume;

            if (volume >= 1) {
                clearInterval(fadeIn);
            }
        }, 100);
    }, { once: true });
});
</script>

</body>
</html>
